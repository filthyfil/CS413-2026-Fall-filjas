# Static type checking of MySolution. From assigns/06:
#     .venv/bin/mypy --config-file MySolution/mypy.ini MySolution/*.py
[mypy]
python_version = 3.12
mypy_path = $MYPY_CONFIG_FILE_DIR

# The supplied file may not be modified; its own findings are not ours to fix.
[mypy-lambda1_vp]
ignore_errors = True
