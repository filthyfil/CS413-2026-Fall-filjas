# Type-check with:  .venv/bin/mypy   (run from MySolution/)
[mypy]
python_version = 3.12
mypy_path = ../LAMBDA3:tests
files = lambda_rpc, tests
strict = True
warn_unreachable = True

# Tests use unittest idioms (untyped helper methods, mock.patch); check bodies
# but do not demand annotations on every test method.
[mypy-_support,test_batches,test_contract_docs,test_envelope,test_failures,test_lambda_methods]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
warn_return_any = False
check_untyped_defs = True

# The provided LAMBDA3 implementation is not ours to change and is not
# type-clean; treat it as an opaque dependency.
[mypy-lambda3,basics0]
follow_imports = skip
ignore_errors = True
